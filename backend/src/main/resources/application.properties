spring.application.name=chococo-backend
spring.profiles.active=dev

server.port=8080

# db-design.md/docker-compose.yml のローカルMySQLに接続する開発用デフォルト。本番はapplication-prod.propertiesで上書き
spring.datasource.url=jdbc:mysql://localhost:3306/chococo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=chococo
spring.datasource.password=chococo

# スキーマはFlywayが管理する。Hibernateは整合性検証のみ
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT設定（auth-design.md 2章　3章）
chococo.jwt.secret=${JWT_SECRET:local-dev-only-insecure-placeholder-change-me-please-32bytes}
chococo.jwt.access-token-ttl-minutes=60
chococo.jwt.refresh-token-ttl-days=14

# AI連携設定（tech-stack.md AI API連携の節）
chococo.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
chococo.ai.anthropic.model=claude-haiku-4-5
chococo.ai.anthropic.base-url=https://api.anthropic.com
chococo.ai.anthropic.max-tokens=300

# 写真アップロード保存先（aws-infra-design.md 3.4節）
chococo.storage.upload-dir=${UPLOAD_DIR:./uploads}
