# 本番プロファイル（AWS EC2 + RDS。aws-infra-design.md参照）
# DB接続情報・JWTシークレット・アップロード先はフォールバックなし。未設定なら起動時に失敗させる
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

chococo.jwt.secret=${JWT_SECRET}

chococo.ai.anthropic.api-key=${ANTHROPIC_API_KEY}

chococo.storage.upload-dir=${UPLOAD_DIR}
