services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: chococo
      MYSQL_USER: chococo
      MYSQL_PASSWORD: chococo
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
