# Chococo 本番Nginx設定
# aws-infra-design.md 2章（全体構成図）・3.4節（画像配信）に対応する。
# EC2上で /etc/nginx/conf.d/chococo.conf として配置する（docs/deploy-runbook.md参照）。

server {
    listen 80;
    server_name _;

    # frontend/dist（Reactビルド成果物）を静的配信
    root /opt/chococo/frontend/dist;
    index index.html;

    location / {
        try_files $uri =404;
    }

    # アップロード画像の静的配信。aws-infra-design.md 3.4節の方針により、
    # JWT認証は通さずUUIDファイル名そのものを閲覧トークンとして扱う
    location /uploads/ {
        alias /var/chococo/uploads/;
    }

    # Spring Bootへのリバースプロキシ
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
